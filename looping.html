<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Looping Maze Generator</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0">
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
      "
    >
      <canvas
        id="unity-canvas"
        tabindex="-1"
        style="width: 100%; height: 100%; background: #2f2f3f"
      ></canvas>
    </div>
    <script src="LoopingBuild/Builds.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "LoopingBuild/Builds.data",
        frameworkUrl: "LoopingBuild/Builds.framework.js",
        codeUrl: "LoopingBuild/Builds.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "dqwertyc.dev",
        productName: "Looping Maze Generator",
        productVersion: "1.0.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      })
        .then((unityInstance) => {})
        .catch((message) => {
          alert(message);
        });
    </script>
  </body>
</html>
